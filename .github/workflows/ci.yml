name: CI

on:
  push:
    branches: [main, codex-next]
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  syntax-check-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'
      - name: Syntax-check all service .mjs files
        run: |
          status=0
          for f in $(git ls-files 'services/*.mjs' 'infrastructure/gateway/*.mjs'); do
            node --check "$f" || status=1
          done
          exit $status

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-superadmin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/superadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: apps/superadmin/package-lock.json
      - run: npm ci
      - run: npm run build
