# SocialPulse — Docker Compose (app + PostgreSQL + Cloudflare Tunnel)
# Run from this directory: `docker compose up -d`. No -p flag needed.
#
# `name:` pins the Compose project name. Without it Docker derives one from the
# directory name — here that is "plusing20" (the folder is "plusing 2.0"), which
# is a *different* project from the running stack. The symptoms are confusing:
# `down` reports nothing to remove, `up` fails with "the container name
# /socialpulse-db is already in use", and it strands an orphan plusing20_default
# network. Pinning it means the flag can never be forgotten, and the -p form
# still works as long as it matches.
name: social-media-manager

# Cloudflare Tunnel runs as its own container on the compose network and forwards
# straight to the app container by service name:
# Cloudflare Tunnel runs as its own container on the compose network and forwards
# straight to the app container by service name:
#   Internet -> socialpulse.dotstark.tech -> cloudflared container -> http://socialpulse:3000
# Tunnel config/credentials live on the host at ~/.cloudflared (mounted read-only below).
#
# DB: PostgreSQL runs as its own container ("db", reachable at db:5432 only
# from inside this compose network — never published to the host, never
# public). The app connects via DATABASE_URL from .env.local. See
# src/lib/db.ts for the connection/migration code.

services:
  socialpulse:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_APP_URL is baked into the client bundle at build time.
      # Must be the public HTTPS URL so Instagram media staging works.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://socialpulse.dotstark.tech}
    container_name: socialpulse
    restart: unless-stopped
    ports:
      # Host 3000 -> container 3000. If host 3000 is taken, change to "3001:3000"
      # and point Cloudflare Tunnel to http://localhost:3001 instead.
      - "${HOST_PORT:-3000}:3000"
    # Secrets injected at runtime, never baked into image
    env_file:
      - .env.local
      # Fallback: if .env.production exists it will be merged if you switch the line above.
      # Keep .env.local as primary so local + prod share the same file for now.
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Ensure public URL is also available at runtime (server-side reads)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://socialpulse.dotstark.tech}
      # DATABASE_URL uses the Docker service name "db", not localhost — inside
      # this container, "localhost" would mean the app container itself, not
      # the DB container. Built from the same POSTGRES_* vars as the db
      # service below (both come from .env.local via env_file) so there is
      # exactly one place credentials are set, not two.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # ----- Persistence: MUST survive container recreation (bind mounts) -----
      # Host files are the source of truth; container writes are preserved on host.
      # If a host file does not exist yet, run: touch scheduled-posts.json linkedin-tokens.json facebook-tokens.json canva-sessions.json whatsapp-events.log whapi-events.log && mkdir -p .instagram-media .media-assets
      - ./scheduled-posts.json:/app/scheduled-posts.json
      - ./linkedin-tokens.json:/app/linkedin-tokens.json
      - ./facebook-tokens.json:/app/facebook-tokens.json
      - ./canva-sessions.json:/app/canva-sessions.json
      - ./.instagram-media:/app/.instagram-media
      - ./.media-assets:/app/.media-assets
      - ./whatsapp-events.log:/app/whatsapp-events.log
      - ./whapi-events.log:/app/whapi-events.log
      # NOTE: no more socialpulse.db bind mount here — auth/OTP data now lives
      # in the "db" (PostgreSQL) service below, persisted via the
      # postgres_data named volume, not a host file.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optional: cap resources if needed
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G

  # PostgreSQL — persistence layer for the auth/OTP system (users,
  # otp_challenges, rate_limit_counters, auth_audit_logs — see
  # src/lib/db.ts). Internal-only: no "ports:" mapping, so it is reachable
  # exclusively from other containers on this compose network (i.e. the
  # "socialpulse" service above), never from the host or the internet.
  db:
    image: postgres:16
    container_name: socialpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately no "ports:" — do NOT add "5432:5432" here. That would
    # expose PostgreSQL to the host/internet; the app reaches it purely over
    # the internal Docker network at db:5432. If you ever need host access
    # for local debugging, run `docker exec -it socialpulse-db psql ...`
    # (see README/deliverables) rather than publishing the port.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: socialpulse-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run socialpulse
    volumes:
      # Tunnel credentials + ingress config, generated once via `cloudflared tunnel login/create`.
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      socialpulse:
        condition: service_healthy

  # Second, independent tunnel for the Superadmin interface only
  # (supersocialpulse.dotstark.tech). Deliberately separate from the
  # `cloudflared` service above: separate tunnel credentials, separate ingress
  # config file, separate container — so the main SocialPulse tunnel is never
  # modified, repointed, or restarted by anything done for Superadmin.
  cloudflared-superadmin:
    image: cloudflare/cloudflared:latest
    container_name: supersocialpulse-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/supersocialpulse-config.yml run supersocialpulse
    volumes:
      # Read-only, and it reads ONLY its own config/credentials from here.
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      socialpulse:
        condition: service_healthy

# Named volume: survives `docker compose down` (without -v), container
# recreation, image rebuilds, and host reboots. Only `docker compose down -v`
# or `docker volume rm` deletes it — see the warning in the deliverables
# summary before ever running that.
volumes:
  postgres_data:
